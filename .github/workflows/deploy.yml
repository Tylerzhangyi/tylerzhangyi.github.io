name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: personal-portfolio/package-lock.json

      - name: Install dependencies
        working-directory: personal-portfolio
        run: npm ci

      - name: Build
        working-directory: personal-portfolio
        env:
          CI: true
        run: npx next build

      - name: Verify build output
        run: |
          test -f personal-portfolio/out/index.html
          test -f personal-portfolio/out/.nojekyll || touch personal-portfolio/out/.nojekyll
          echo "Pages artifact size:"
          du -sh personal-portfolio/out

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: personal-portfolio/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 10
