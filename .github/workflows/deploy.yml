name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: personal-portfolio/package-lock.json

      - name: Install dependencies
        working-directory: personal-portfolio
        run: npm ci

      - name: Build
        working-directory: personal-portfolio
        env:
          CI: true
        run: npx next build

      - name: Prepare static output
        run: |
          test -f personal-portfolio/out/index.html
          touch personal-portfolio/out/.nojekyll
          find personal-portfolio/out -name '.DS_Store' -delete
          echo "Deploy artifact size:"
          du -sh personal-portfolio/out

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./personal-portfolio/out
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'deploy: ${{ github.event.head_commit.message }}'
