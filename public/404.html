<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redirect 404s to index.html so Vue Router can handle routing
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      
      // Save the current path to sessionStorage before redirecting
      // This allows Vue Router to restore the correct route after the redirect
      if (path !== '/index.html' && path !== '/') {
        var fullPath = path + search + hash;
        sessionStorage.setItem('redirectPath', fullPath);
      }
      
      // Redirect to index.html (without preserving search/hash in URL)
      // The full path is saved in sessionStorage and will be restored by Vue Router
      window.location.replace('/index.html');
    </script>
    <meta http-equiv="refresh" content="0; url=/index.html">
    <script
      src="http://localhost:3000/tracker.js"
      data-site="tylerzhangyi.github.io"
      data-endpoint="http://localhost:3000/collect"
      defer
    ></script>
  </head>
  <body>
    <p>If you are not redirected automatically, <a href="/index.html">click here</a>.</p>
  </body>
</html>
